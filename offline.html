<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline | MushClub</title>
  <link rel="stylesheet" href="css/styles.css?v=16">
  <style>
    /* Specific styles for the offline page */
    body {
      background-color: var(--neutral-50, #fcfcfc);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: var(--font-body, system-ui, -apple-system, sans-serif);
      margin: 0;
    }

    .offline-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .offline-icon {
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
      color: var(--brand-primary, #2d5a3d);
      opacity: 0.8;
    }

    .offline-title {
      font-family: var(--font-heading, serif);
      font-size: 2.5rem;
      color: var(--brand-primary-dark, #1a3c26);
      margin-bottom: 1rem;
    }

    .offline-message {
      font-size: 1.125rem;
      color: var(--neutral-600, #555555);
      max-width: 500px;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .offline-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      font-family: var(--font-body, sans-serif);
    }

    .btn-primary {
      background-color: var(--brand-primary, #2d5a3d);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--brand-primary-light, #3d7a52);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--brand-primary, #2d5a3d);
      border-color: var(--brand-primary, #2d5a3d);
    }

    .btn-outline:hover {
      background-color: var(--brand-primary, #2d5a3d);
      color: white;
    }

    .offline-footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--neutral-500, #777777);
      border-top: 1px solid var(--neutral-200, #e0e0e0);
      font-family: var(--font-body, sans-serif);
    }
  </style>
</head>

<body>

  <div class="offline-wrapper">
    <!-- Mushroom / Network Offline Icon -->
    <svg class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      <line x1="10" y1="10" x2="18" y2="18" />
      <line x1="18" y1="10" x2="10" y2="18" />
    </svg>

    <h1 class="offline-title">You're Offline</h1>
    <p class="offline-message">
      It looks like your internet connection is unavailable. Don't worry—once you're back online, MushClubb will be
      ready for you.
    </p>

    <div class="offline-actions">
      <button onclick="window.location.reload()" class="btn btn-primary">Try Again</button>
      <a href="index.html" class="btn btn-outline">Go to Home</a>
    </div>
  </div>

  <footer class="offline-footer">
    &copy; <span id="current-year">2026</span> MushClubb. Premium Mushroom Solutions.
  </footer>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();

    // Automatically reload the page when the connection comes back
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>

</html>
